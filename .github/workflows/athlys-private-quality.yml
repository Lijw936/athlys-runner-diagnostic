# Independent quality runner for the private Athlys2 source repository
name: Athlys private source quality

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/athlys-private-quality.yml"

permissions:
  contents: read

concurrency:
  group: athlys-private-source-quality-main
  cancel-in-progress: true

jobs:
  quality:
    name: Validate private Athlys2 main
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout private Athlys source
        uses: actions/checkout@v4
        with:
          repository: Lijw936/Athlys2
          ref: main
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false

      - name: Identify source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore successful-validation marker
        id: validated
        uses: actions/cache/restore@v4
        with:
          path: .athlys-ci-cache/validated
          key: athlys-web-quality-${{ steps.source.outputs.sha }}

      - name: Set up Node.js
        if: steps.validated.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/athlys-remote-ai/package-lock.json

      - name: Run vitrine, mobile, remote AI and static quality tests
        if: steps.validated.outputs.cache-hit != 'true'
        run: |
          node --test web/site-vitrine.test.cjs
          node --check web/app.js
          node --test web/mobile-experience.test.cjs
          node --test web/assistant-remote-only.test.cjs
          node scripts/check-android-1.3.7-download.cjs
          node --check supabase/functions/athlys-quantum-analysis/quantum-engine.js
          node --test web/quantum-engine.test.cjs
          node --test web/quantum-remote-only.test.cjs
          node --check supabase/functions/athlys-performance-analysis/analysis-engine.js
          node --test web/performance-engine.test.cjs
          node --test web/performance-remote-only.test.cjs
          node --check supabase/functions/athlys-performance-analysis/health-summary-engine.mjs
          node --test web/health-summary-engine.test.mjs web/health-summary-remote-only.test.cjs
          node --check web/mobile.js
          node --check web/sw.js
          node --check web/pwa.js
          node --check web/offline-store.js
          node --check web/ios-install.js
          node --check web/site.js
          node --check web/club.js
          node --check desktop-club/main.cjs
          node --check desktop-club/copy-web.cjs

      - name: Test free-only remote AI gateway
        if: steps.validated.outputs.cache-hit != 'true'
        working-directory: services/athlys-remote-ai
        run: |
          npm ci
          npm test

      - name: Validate JSON manifests
        if: steps.validated.outputs.cache-hit != 'true'
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('web/manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('web/mobile.webmanifest','utf8'))"

      - name: Verify service-worker precache paths
        if: steps.validated.outputs.cache-hit != 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sw = fs.readFileSync('web/sw.js', 'utf8');
          const block = sw.match(/const SHELL = \[([\s\S]*?)\];/);
          if (!block) throw new Error('SHELL precache list missing');
          const paths = [...block[1].matchAll(/"([^"]+)"/g)].map(x => x[1]);
          const missing = paths.filter(path => !fs.existsSync('web' + (path === '/' ? '/index.html' : path)));
          if (missing.length) throw new Error('Missing precache resources: ' + missing.join(', '));
          console.log('Verified ' + paths.length + ' service-worker resources.');
          NODE

      - name: Store successful-validation marker
        if: success() && steps.validated.outputs.cache-hit != 'true'
        run: |
          mkdir -p .athlys-ci-cache
          printf '%s\n' "${{ steps.source.outputs.sha }}" > .athlys-ci-cache/validated

      - name: Cache successful source revision
        if: success() && steps.validated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .athlys-ci-cache/validated
          key: athlys-web-quality-${{ steps.source.outputs.sha }}

      - name: Report source revision
        if: always()
        run: |
          echo "Athlys2 source SHA: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.validated.outputs.cache-hit }}" = "true" ]; then
            echo "This exact source revision was already validated successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation executed by the independent public runner." >> "$GITHUB_STEP_SUMMARY"
          fi
